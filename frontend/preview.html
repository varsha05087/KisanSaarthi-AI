    function formatPhone(p) {
      if (!p) return '';
      const c = p.toString().replace(/\D/g, '');
      return c.length === 10 ? `${c.slice(0, 5)} ${c.slice(5)}` : c;
    }

    function App() {
      const [lang, setLang] = useState(() => {
        try {
          const s = localStorage.getItem('kisansaarthi_lang');
          if (s && ['te', 'hi', 'en'].includes(s)) return s;
          const nav = navigator.language || '';
          if (nav.startsWith('hi')) return 'hi';
        } catch {}
        return 'te';
      });

      const [currentFarmer, setCurrentFarmer] = useState(() => {
        try {
          const s = localStorage.getItem('kisansaarthi_current_farmer');
          return s ? JSON.parse(s) : null;
        } catch { return null; }
      });

          return;

        try {
          const raw = localStorage.getItem('kisansaarthi_all_requests');

          const cleanAll = all.filter(r => !['TRK-8921', 'DIA-4819', 'REQ-101', 'REQ-102'].includes(r.id));

          window.speechSynthesis.speak(u);
        }
      };

      // General speech recognition helper
      const startListening = (onResult) => {

        if (!SpeechRec) {
          alert('Speech Recognition is best supported in Google Chrome.');
          return;
        }
        const recognizer = new SpeechRec();
        recognizer.lang = lang === 'te' ? 'te-IN' : lang === 'hi' ? 'hi-IN' : 'en-IN';
        recognizer.interimResults = false;
        recognizer.onresult = (e) => {
          const text = e.results[0][0].transcript;
          onResult(text);
        };
        recognizer.start();
      };

      // Identity step handlers
      const handleSaveFarmer = (name, phone) => {

      const handleQuickPhoneLogin = () => {

                      speak(t.understandingMsg);
                    });
                  }}
                  className="rounded-3xl p-6 text-center cursor-pointer transition-all border-2 bg-gradient-to-b from-green-50 to-emerald-50 hover:to-green-100 border-[#2E7D32]/30 shadow-md active:scale-98 select-none"
                >
                  <div className="relative my-2 flex justify-center">
                    <div className="w-20 h-20 rounded-full flex items-center justify-center text-4xl text-white transition-all shadow-lg bg-[#2E7D32] animate-wave-pulse">
                      🎤
                    </div>
                  </div>

                  <h3 className="text-xl font-bold text-[#26332A] mt-3">{t.talkTitle}</h3>
                  <p className="text-xs sm:text-sm text-[#66736A] mt-1 font-medium">{t.talkSub}</p>
                  <p className="text-[11px] font-bold text-[#2E7D32] mt-2">{t.voiceLanguages}</p>
                </div>

                {/* Camera Card */}
                <div
                  onClick={() => {
                    handlePhotoDiagnose();
                  }}
                  className="rounded-3xl p-5 bg-white border-2 border-[#2E7D32]/20 shadow-md hover:shadow-lg cursor-pointer flex items-center gap-4 transition-all active:scale-98"
                >
                  <div className="w-16 h-16 rounded-2xl bg-amber-50 text-amber-700 border border-amber-200 flex items-center justify-center text-3xl">
                    📷
                  </div>
                  <div className="flex-1">
                    <div className="flex items-center gap-2">
                      <h3 className="text-lg font-bold text-[#26332A]">{t.showProblem}</h3>
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-900">Photo</span>
                    </div>
                    <p className="text-xs text-[#66736A] mt-0.5">{t.showSub}</p>
                  </div>
                </div>

                {/* Quick Actions */}
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="text-base font-bold text-[#26332A]">{t.quickTitle}</h3>
                    <span className="text-xs text-[#66736A] font-semibold">{t.fourServices}</span>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { icon: '🌱', title: t.crop, desc: t.cropDesc, tag: 'AI Vision', color: 'bg-emerald-500' },
                      { icon: '🚜', title: t.tractor, desc: t.tractorDesc, tag: 'Booking', color: 'bg-amber-600' },
                      { icon: '🌾', title: t.seeds, desc: t.seedsDesc, tag: 'Certified', color: 'bg-lime-600' },
                      { icon: '🛡', title: t.insurance, desc: t.insuranceDesc, tag: 'PMFBY', color: 'bg-blue-600' },
                    ].map((item, idx) => (
                      <div
                        key={idx}
                        onClick={() => {
                          if (item.tag === 'Booking') {
                            handleBookTractor();
                            alert(t.tractorBookedMsg);
                          } else if (item.tag === 'Certified') {
                            handleRequestSeed();
                          } else if (item.tag === 'PMFBY') {
                            handleInsuranceClaim();
                          } else {
                            handlePhotoDiagnose();
                          }
                        }}
                        className="p-4 rounded-2xl bg-white border border-[#E3E0D8] shadow-sm hover:shadow-md cursor-pointer transition-all active:scale-95 flex flex-col justify-between min-h-[135px]"
                      >
                        <div className="flex justify-between items-start">
                          <span className={`w-10 h-10 rounded-xl ${item.color} text-white flex items-center justify-center text-xl shadow-sm`}>
                            {item.icon}
                          </span>
                          <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-gray-100 text-gray-700">
                            {item.tag}
                          </span>
                        </div>
                        <div className="mt-2">
                          <h4 className="font-bold text-sm text-[#26332A]">{item.title}</h4>
                          <p className="text-[11px] text-[#66736A] mt-0.5 line-clamp-2">{item.desc}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Farmer-Specific Recent Requests */}
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <h3 className="text-base font-bold text-[#26332A]">{t.recentRequests}</h3>
                    <button onClick={() => setActiveTab('requests')} className="text-xs font-bold text-[#2E7D32]">{t.viewAll}</button>
                  </div>
                  {farmerRequests.length === 0 ? (
                    <div className="p-4 rounded-2xl bg-white border text-center text-xs text-gray-500">
                      {t.noRequests}
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {farmerRequests.slice(0, 2).map((r) => (
                        <div key={r.id} className="p-3 bg-white rounded-2xl border shadow-sm flex items-center justify-between text-xs">
                          <div>
                            <span className="font-bold">{r.title}</span>
                            <p className="text-gray-500">{r.date} • {r.farmerName}</p>
                          </div>
                          <span className="px-2 py-0.5 rounded-full font-bold bg-green-100 text-green-800">{r.status}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </main>
            )}

            {/* ================= REQUESTS TAB ================= */}
            {activeTab === 'requests' && (
              <main className="flex-1 p-5 pb-24 overflow-y-auto space-y-4">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-bold text-[#26332A]">{t.reqNav}</h2>
                    <p className="text-xs text-[#66736A]">
                      👤 {currentFarmer.name} • 📱 {formatPhone(currentFarmer.phone)}
                    </p>
                  </div>
                  <button
                    onClick={() => { handleBookTractor(); alert(t.tractorBookedMsg); }}
                    className="px-3 py-1.5 bg-[#2E7D32] text-white rounded-xl text-xs font-bold shadow active:scale-95"
                  >
                    {t.bookBtnShort}
                  </button>
                </div>

                {farmerRequests.length === 0 ? (
                  <div className="p-8 text-center bg-white rounded-3xl border border-dashed text-sm text-gray-500 space-y-2">
                    <p>{t.noRequestsAccount}</p>
                    <button onClick={() => { handleBookTractor(); alert(t.tractorBookedMsg); }} className="px-4 py-2 rounded-xl bg-[#2E7D32] text-white text-xs font-bold">
                      {t.bookTractorBtn}
                    </button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {farmerRequests.map((r) => (
                      <div key={r.id} className="p-4 rounded-2xl bg-white border border-[#E3E0D8] shadow-sm flex items-center justify-between">
                        <div>
                          <h4 className="font-bold text-sm text-[#26332A]">{r.title}</h4>
                          <p className="text-xs text-[#66736A] mt-0.5">{r.date} • ID: {r.id}</p>
                          <p className="text-[11px] font-bold text-[#2E7D32] mt-0.5">{t.farmerLabel}: {r.farmerName} ({formatPhone(r.farmerPhone)})</p>
                        </div>
                        <span className={`text-xs font-bold px-2.5 py-1 rounded-full border ${r.color || 'bg-green-100 text-green-800'}`}>
                          {r.status}
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </main>
            )}

            {/* ================= PROFILE TAB ================= */}
            {activeTab === 'profile' && (
              <main className="flex-1 p-5 pb-24 overflow-y-auto space-y-4">
                <h2 className="text-2xl font-bold text-[#26332A]">{t.meNav}</h2>

                {/* Farmer Card */}
                <div className="p-5 rounded-3xl bg-white border-2 border-[#2E7D32]/30 shadow-md flex items-center gap-4">
                  <div className="w-16 h-16 rounded-2xl bg-green-50 flex items-center justify-center text-3xl">👨‍🌾</div>
                  <div>
                    <h3 className="font-bold text-xl text-[#26332A]">{currentFarmer.name}</h3>
                    <p className="text-xs text-[#66736A] font-mono mt-0.5 font-bold">📱 {formatPhone(currentFarmer.phone)}</p>
                    <p className="text-[11px] text-gray-500 font-mono mt-0.5">ID: #{currentFarmer.id}</p>
                    <span className="inline-block mt-1 text-[11px] font-bold text-[#2E7D32] bg-green-50 px-2 py-0.5 rounded-full">
                      🟢 {t.verifiedVoice}
                    </span>
                  </div>
                </div>

                {/* Settings list */}
                <div className="space-y-3">
                  <div onClick={() => setIsModalOpen(true)} className="p-4 rounded-2xl bg-white border border-[#E3E0D8] cursor-pointer flex justify-between items-center">
                    <div>
                      <h4 className="font-bold text-sm">🌐 {t.changeLang}</h4>
                      <p className="text-xs text-[#66736A]">{languages.find(l => l.code === lang)?.native} ({languages.find(l => l.code === lang)?.eng})</p>
                    </div>
                    <span className="text-[#2E7D32] font-bold">{t.change} →</span>
                  </div>

                  {/* Change Farmer / Logout */}
                  <div
                    onClick={() => setShowLogoutConfirm(true)}
                    className="p-4 rounded-2xl bg-rose-50 border border-rose-200 cursor-pointer flex justify-between items-center text-rose-700"
                  >
                    <div>
                      <h4 className="font-bold text-sm">🚪 {t.changeFarmer}</h4>
                      <p className="text-xs text-rose-600/80">{t.changeFarmerSub}</p>
                    </div>
                    <span className="font-bold text-xs bg-rose-200 px-3 py-1 rounded-full">{t.change}</span>
                  </div>
                </div>
              </main>
            )}

            {/* Bottom Nav */}
            <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-[#E3E0D8] shadow-lg">
              <div className="max-w-lg mx-auto flex items-center justify-around py-2">
                {[
                  { id: 'home', icon: '🏠', label: t.homeNav },
                  { id: 'requests', icon: '📋', label: t.reqNav },
                  { id: 'profile', icon: '👤', label: t.meNav },
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex flex-col items-center py-1 px-4 rounded-xl transition-all ${
                      activeTab === item.id ? 'text-[#2E7D32] font-bold scale-105' : 'text-[#66736A]'
                    }`}
                  >
                    <span className="text-xl">{item.icon}</span>
                    <span className="text-xs mt-0.5">{item.label}</span>
                  </button>
                ))}
              </div>
            </nav>

            {/* Change Farmer Modal */}
            {showLogoutConfirm && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl text-center space-y-3">
                  <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-700 mx-auto flex items-center justify-center text-2xl">
                    🚪
                  </div>
                  <h3 className="font-bold text-lg text-[#26332A]">{t.changeFarmerTitle}</h3>
                  <p className="text-xs text-gray-600">{t.changeFarmerConfirm}</p>
                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button onClick={() => setShowLogoutConfirm(false)} className="py-2.5 rounded-xl border text-xs font-bold">
                      {t.cancelBtn}
                    </button>
                    <button onClick={handleLogout} className="py-2.5 rounded-xl bg-rose-600 text-white text-xs font-bold">
                      {t.changeFarmerBtn}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Language Selector Modal */}
            {isModalOpen && (
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-3">
                  <div className="flex justify-between items-center pb-2 border-b">
                    <h3 className="font-bold text-lg text-[#26332A]">{t.changeLang}</h3>
                    <button onClick={() => setIsModalOpen(false)} className="text-xl">✕</button>
                  </div>
                  {languages.map((l) => (
                    <div
                      key={l.code}
                      onClick={() => { changeLanguage(l.code); speak(l.greeting); }}
                      className={`p-3.5 rounded-2xl border-2 cursor-pointer flex justify-between items-center ${
                        lang === l.code ? 'border-[#2E7D32] bg-green-50 font-bold' : 'border-gray-200'
                      }`}
                    >
                      <div className="flex items-center gap-2">
                        <span>{l.flag}</span>
                        <span>{l.native}</span>
                        <span className="text-xs text-gray-500 font-normal">({l.eng})</span>
                      </div>
                      <button onClick={(e) => { e.stopPropagation(); speak(l.greeting); }} className="text-xs text-[#2E7D32] font-bold px-2 py-1 bg-white rounded-lg border">
                        🔊
                      </button>
                    </div>
                  ))}
                  <button
                    onClick={() => setIsModalOpen(false)}
                    className="w-full py-3 rounded-xl bg-[#2E7D32] text-white font-bold text-sm shadow-md mt-2"
                  >
                    {t.doneBtn}
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
